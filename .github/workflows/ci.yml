name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
      REDIS_PASSWORD: ci-only-redis-password
      ADMIN_USERNAME: ciadmin
      ADMIN_PASSWORD: ci-only-admin-password-123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Typecheck and lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run server:build

      - name: Build production image
        run: docker compose build app

      - name: Scan production image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ciodesk-app:latest
          only-severities: critical,high
          exit-code: true

      - name: Start integration stack
        run: docker compose up -d --no-build db redis app

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8880/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=200 db redis app
          exit 1

      - name: Run API smoke tests
        shell: bash
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8880/api/health)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8880/api/categories)" = "401"

          login_response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"ci-only-admin-password-123"}' \
            http://localhost:8880/api/auth/login)
          token=$(printf '%s' "$login_response" | jq -r '.token')
          test -n "$token"
          test "$token" != "null"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://localhost:8880/api/auth/me)" = "200"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://localhost:8880/api/profiles)" = "200"

          requester_response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"username":"cirequester","password":"ci-requester-password-123","office":"CI","contact":"ci@example.com"}' \
            http://localhost:8880/api/auth/register)
          requester_token=$(printf '%s' "$requester_response" | jq -r '.token')
          test -n "$requester_token"
          test "$requester_token" != "null"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $requester_token" \
            http://localhost:8880/api/profiles)" = "403"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Authorization: Bearer invalid-ci-token' \
            http://localhost:8880/api/auth/me)" = "401"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://localhost:8880/api/auth/login)" = "400"

          for attempt in $(seq 1 20); do
            curl --silent --output /dev/null \
              -H 'Content-Type: application/json' \
              -d '{"username":"ciadmin","password":"incorrect-ci-password"}' \
              http://localhost:8880/api/auth/login
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"incorrect-ci-password"}' \
            http://localhost:8880/api/auth/login)" = "429"

      - name: Show integration status
        run: docker compose ps

      - name: Collect integration diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          docker compose ps > ci-artifacts/compose-ps.txt 2>&1 || true
          docker compose config > ci-artifacts/compose-config.yml 2>&1 || true
          docker compose logs --no-color --timestamps db redis app > ci-artifacts/compose-logs.txt 2>&1 || true
          docker inspect ciodesk-db-1 ciodesk-redis-1 ciodesk-app-1 > ci-artifacts/container-inspect.json 2>&1 || true

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-diagnostics
          path: ci-artifacts/
          if-no-files-found: warn

      - name: Stop integration stack
        if: always()
        run: docker compose down

