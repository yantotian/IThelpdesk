name: ciodesk

services:
  db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-helpdesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Production service: built assets, nginx, optimized for deployment
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8880}:80"
    environment:
      NODE_ENV: production
      PORT: 5577
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-helpdesk}
      DATABASE_WAIT_HOST: db
      DATABASE_WAIT_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env before starting}
      UPLOAD_DIR: /app/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads:/app/uploads

  # Development service: source-mounted for hot-reloading. Uses the `api` build
  # stage so both Vite and tsx dependencies are available in one container.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ciodesk-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5173:5173"    # Vite dev server
      - "5577:5577"    # API with hot-reload
    environment:
      NODE_ENV: development
      PORT: 5577
      APP_PORT: 5577
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env before starting}
      UPLOAD_DIR: /app/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/server/node_modules
      - uploads:/app/uploads
    working_dir: /app
    entrypoint: []
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0 & (cd server && npm run dev) & wait"]

  # Mailhog for email testing and preview
  mailhog:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8025:8025"   # Email UI
      - "127.0.0.1:1025:1025"   # SMTP endpoint

  # PgAdmin for PostgreSQL database management
  pgadmin:
    image: dpage/pgadmin4@sha256:8a68677a97b8c8d1427dc915672a26d2c4a04376916a68256f53d669d6171be7
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping')"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  uploads: